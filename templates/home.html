{% extends "base.html" %}

{% component home_page(section: map) %}
<main>
  <article>
    <section class="body">
      {% if section.title %}
      {{
      <post.page_header title={section.title} />}}
      {% endif %}

      <div class="home-container">
        <div class="face-container"><img class="face" src="/face.jpg"></div>
        <div class="home-content">{{ section.content | safe }}</div>
      </div>
    </section>
  </article>
</main>
{% endcomponent home_page %}

{% block main_content %}
{{
<home_page section={section} />
}}
{% endblock main_content %}
